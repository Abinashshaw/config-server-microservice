eureka:
  instance: 
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true
    
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

hotel:
  service:
    id: HOTEL-SERVICE

rating:
  service:
    id: RATING-SERVICE

user:
  service:
    id: USER-SERVICE

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      waitDurationInOpenState: 10000
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 2s
